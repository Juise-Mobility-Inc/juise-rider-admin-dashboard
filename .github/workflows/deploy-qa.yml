name: Deploy QA to Google Cloud

on:
  push:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: juise-rider-admin-dashboard-qa
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: juise-fed-pre-run-154427
  GCP_REGION: us-east5
  ARTIFACT_REGISTRY_HOST: us-east5-docker.pkg.dev
  ARTIFACT_REGISTRY_REPOSITORY: juise-containers
  SERVICE_NAME: juise-rider-admin-dashboard
  IMAGE_NAME: juise-rider-admin-dashboard

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: /kca-api

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v5
      - name: Verify QA deployment context
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY_OWNER}" = "Juise-Mobility-Inc"
          test "${GITHUB_REF}" = "refs/heads/qa"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push immutable image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${ARTIFACT_REGISTRY_HOST}" --quiet
          IMAGE="${ARTIFACT_REGISTRY_HOST}/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}"
          docker build --tag "${IMAGE}:${GITHUB_SHA}" .
          PUSH_OUTPUT="$(docker push "${IMAGE}:${GITHUB_SHA}" | tee /dev/stderr)"
          DIGEST="$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          test -n "${DIGEST}"
          echo "SERVICE_DIGEST_REF=${IMAGE}@${DIGEST}" >> "${GITHUB_ENV}"
      - name: Confirm Terraform bootstrap
        run: |
          if ! gcloud run services describe "${SERVICE_NAME}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" >/dev/null 2>&1; then
            echo "::error::Terraform must create ${SERVICE_NAME} before GitHub can update it. The built image is ${SERVICE_DIGEST_REF}."
            exit 1
          fi
      - name: Deploy and verify QA
        run: |
          set -euo pipefail
          gcloud run services update "${SERVICE_NAME}" --image "${SERVICE_DIGEST_REF}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --quiet
          URL="$(gcloud run services describe "${SERVICE_NAME}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "${SERVICE_NAME}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.latestReadyRevisionName)')"
          DEPLOYED="$(gcloud run revisions describe "${REVISION}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(spec.containers[0].image)')"
          test "${DEPLOYED}" = "${SERVICE_DIGEST_REF}"
          test "$(curl --fail --silent --output /dev/null --write-out '%{http_code}' "${URL}/health/live")" = "200"
          printf '## Dashboard QA\n\n- Image: `%s`\n- Revision: `%s`\n- Cloud Run URL: %s\n- Intended hostname: https://qa-dashboard.juisemobility.com\n' "${SERVICE_DIGEST_REF}" "${REVISION}" "${URL}" >> "${GITHUB_STEP_SUMMARY}"
